<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINDTREE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body, html, #root { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
        .node-card { transition: box-shadow 0.2s, border-color 0.2s; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useCallback, useRef, useEffect } = React;

        const DEFAULT_COLORS = [
            '#3b82f6', '#10b981', '#ef4444', '#8b5cf6', '#f59e0b', '#f472b6', '#64748b'
        ];

        function App() {
            const [nodes, setNodes] = useState([
                { id: 'root-1', title: 'Мой Проект', content: 'Добро пожаловать!', x: 100, y: 100, width: 300, height: 150, parentId: null, type: 'text', color: '#3b82f6' }
            ]);
            const [selectedNodeId, setSelectedNodeId] = useState(null);
            const [offset, setOffset] = useState({ x: 0, y: 0 });
            const [scale, setScale] = useState(1);
            const [isPanning, setIsPanning] = useState(false);

            const interactionRef = useRef({ activeId: null, type: null, startX: 0, startY: 0, initialNodeX: 0, initialNodeY: 0 });

            const handleMouseDown = (e, node, type) => {
                e.stopPropagation();
                if (type === 'canvas') {
                    setIsPanning(true);
                    return;
                }
                setSelectedNodeId(node.id);
                interactionRef.current = {
                    activeId: node.id,
                    type: type,
                    startX: e.clientX,
                    startY: e.clientY,
                    initialNodeX: node.x,
                    initialNodeY: node.y
                };
            };

            useEffect(() => {
                const handleMouseMove = (e) => {
                    if (isPanning) {
                        setOffset(prev => ({ x: prev.x + e.movementX, y: prev.y + e.movementY }));
                        return;
                    }
                    const { activeId, type, startX, startY, initialNodeX, initialNodeY } = interactionRef.current;
                    if (!activeId || type !== 'drag') return;

                    const dx = (e.clientX - startX) / scale;
                    const dy = (e.clientY - startY) / scale;

                    setNodes(prev => prev.map(n => n.id === activeId ? { ...n, x: initialNodeX + dx, y: initialNodeY + dy } : n));
                };

                const handleMouseUp = () => {
                    setIsPanning(false);
                    interactionRef.current.activeId = null;
                };

                window.addEventListener('mousemove', handleMouseMove);
                window.addEventListener('mouseup', handleMouseUp);
                return () => {
                    window.removeEventListener('mousemove', handleMouseMove);
                    window.removeEventListener('mouseup', handleMouseUp);
                };
            }, [isPanning, scale]);

            const handleAddNode = () => {
                const newNode = {
                    id: `node-${Date.now()}`,
                    title: 'Новая идея',
                    content: '',
                    x: (window.innerWidth / 2 - offset.x) / scale - 150,
                    y: (window.innerHeight / 2 - offset.y) / scale - 75,
                    width: 300,
                    height: 150,
                    color: DEFAULT_COLORS[Math.floor(Math.random() * DEFAULT_COLORS.length)]
                };
                setNodes([...nodes, newNode]);
            };

            const currentNode = nodes.find(n => n.id === selectedNodeId);

            return (
                <div className="w-full h-full bg-slate-50 relative" onMouseDown={(e) => handleMouseDown(e, null, 'canvas')}>
                    {/* Сетка */}
                    <div className="absolute inset-0" style={{ 
                        backgroundImage: 'radial-gradient(#cbd5e1 1px, transparent 1px)', 
                        backgroundSize: '30px 30px',
                        backgroundPosition: `${offset.x}px ${offset.y}px`
                    }} />

                    {/* Контент */}
                    <div style={{ transform: `translate(${offset.x}px, ${offset.y}px) scale(${scale})`, transformOrigin: '0 0' }}>
                        {nodes.map(node => (
                            <div 
                                key={node.id}
                                onMouseDown={(e) => handleMouseDown(e, node, 'drag')}
                                className={`absolute bg-white rounded-3xl shadow-xl border-2 p-6 cursor-move node-card ${selectedNodeId === node.id ? 'border-blue-500 ring-4 ring-blue-500/10' : 'border-transparent'}`}
                                style={{ left: node.x, top: node.y, width: node.width, borderTop: `8px solid ${node.color}` }}
                            >
                                <div className="text-xs font-bold text-slate-400 uppercase mb-2">{node.title}</div>
                                <div className="text-slate-600">{node.content || "Нажми, чтобы редактировать"}</div>
                            </div>
                        ))}
                    </div>

                    {/* Кнопка добавления */}
                    <div className="fixed top-6 left-6 flex gap-4">
                        <button onClick={handleAddNode} className="bg-slate-900 text-white px-6 py-3 rounded-2xl font-bold shadow-lg hover:bg-black transition-all active:scale-95">
                            + НОВЫЙ УЗЕЛ
                        </button>
                    </div>

                    {/* Редактор */}
                    {selectedNodeId && currentNode && (
                        <div className="fixed top-6 right-6 w-80 bg-white/90 backdrop-blur-xl p-6 rounded-[32px] shadow-2xl border border-white" onMouseDown={e => e.stopPropagation()}>
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="font-black text-slate-800">РЕДАКТОР</h2>
                                <button onClick={() => setSelectedNodeId(null)} className="text-slate-400">✕</button>
                            </div>
                            <input 
                                className="w-full bg-slate-100 p-3 rounded-xl mb-3 outline-none focus:ring-2 ring-blue-400" 
                                value={currentNode.title} 
                                onChange={e => setNodes(nodes.map(n => n.id === selectedNodeId ? {...n, title: e.target.value} : n))}
                            />
                            <textarea 
                                className="w-full bg-slate-100 p-3 rounded-xl h-32 outline-none focus:ring-2 ring-blue-400" 
                                value={currentNode.content} 
                                onChange={e => setNodes(nodes.map(n => n.id === selectedNodeId ? {...n, content: e.target.value} : n))}
                            />
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
