<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MINDTREE FINAL</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
html, body, #root { height:100%; margin:0; overflow:hidden; }
.node-inner::-webkit-scrollbar { width:4px; }
.node-inner::-webkit-scrollbar-thumb { background:#e2e8f0; border-radius:10px; }
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">

const { useState, useRef, useEffect } = React;

const Plus = () => (
<svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3">
<line x1="12" y1="5" x2="12" y2="19"/>
<line x1="5" y1="12" x2="19" y2="12"/>
</svg>
);

const Music = () => (
<svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
<path d="M9 18V5l12-2v13"/>
<circle cx="6" cy="18" r="3"/>
<circle cx="18" cy="16" r="3"/>
</svg>
);

const COLORS = ['#3b82f6','#10b981','#ef4444','#8b5cf6','#f59e0b','#f472b6','#06b6d4'];

function App(){

const [nodes,setNodes]=useState([
{ id:'1', title:'PROJECT', content:'Начни писать...', x:400,y:200,width:320,height:200,parentId:null,color:'#3b82f6',media:'' }
]);

const [selected,setSelected]=useState(null);
const [offset,setOffset]=useState({x:0,y:0});
const [scale,setScale]=useState(1);
const [panning,setPanning]=useState(false);

const ref=useRef({id:null,type:null,sx:0,sy:0,ix:0,iy:0,iw:0,ih:0});

const getSpotify=(url)=>{
if(!url) return null;
const m=url.match(/spotify\.com\/(track|album|playlist|artist)\/([a-zA-Z0-9]+)/);
return m?`https://open.spotify.com/embed/${m[1]}/${m[2]}`:null;
};

const mouseDown=(e,node,type)=>{
if(type==='canvas'){ setPanning(true); return; }
e.stopPropagation();
setSelected(node.id);
ref.current={id:node.id,type,sx:e.clientX,sy:e.clientY,ix:node.x,iy:node.y,iw:node.width,ih:node.height};
};

useEffect(()=>{
const move=e=>{
if(panning){
setOffset(p=>({x:p.x+e.movementX,y:p.y+e.movementY}));
return;
}
const {id,type,sx,sy,ix,iy,iw,ih}=ref.current;
if(!id) return;

const dx=(e.clientX-sx)/scale;
const dy=(e.clientY-sy)/scale;

setNodes(prev=>prev.map(n=>{
if(n.id!==id) return n;
return type==='drag'
? {...n,x:ix+dx,y:iy+dy}
: {...n,width:Math.max(200,iw+dx),height:Math.max(150,ih+dy)};
}));
};

const up=()=>{ setPanning(false); ref.current.id=null; };

window.addEventListener('mousemove',move);
window.addEventListener('mouseup',up);
return ()=>{window.removeEventListener('mousemove',move);window.removeEventListener('mouseup',up);}
},[panning,scale]);

const addNode=(parent=null)=>{
const id=Date.now().toString();
const n={
id,
title:'ИДЕЯ',
content:'',
x:parent?parent.x+300:(window.innerWidth/2-offset.x)/scale-150,
y:parent?parent.y+50:(window.innerHeight/2-offset.y)/scale-75,
width:300,height:200,
parentId:parent?parent.id:null,
color:parent?parent.color:COLORS[Math.floor(Math.random()*COLORS.length)],
media:''
};
setNodes([...nodes,n]);
setSelected(id);
};

const curr=nodes.find(n=>n.id===selected);

return(
<div className="w-full h-full relative select-none"
onMouseDown={e=>mouseDown(e,null,'canvas')}>

<div className="absolute inset-0"
style={{
backgroundImage:'radial-gradient(#e2e8f0 2px, transparent 2px)',
backgroundSize:`${30*scale}px ${30*scale}px`,
backgroundPosition:`${offset.x}px ${offset.y}px`
}}/>

<div style={{transform:`translate(${offset.x}px,${offset.y}px) scale(${scale})`,transformOrigin:'0 0'}}>

<svg className="absolute inset-0 pointer-events-none" style={{width:5000,height:5000}}>
{nodes.map(n=>{
const p=nodes.find(x=>x.id===n.parentId);
if(!p) return null;
return <path key={n.id}
d={`M ${p.x+p.width} ${p.y+p.height/2} C ${p.x+400} ${p.y}, ${n.x-100} ${n.y}, ${n.x} ${n.y+n.height/2}`}
stroke={n.color} strokeWidth="3" fill="none" opacity="0.4"/>
})}
</svg>

{nodes.map(n=>(
<div key={n.id}
onMouseDown={e=>mouseDown(e,n,'drag')}
className={`absolute bg-white rounded-[32px] shadow-xl border-2 flex flex-col
${selected===n.id?'border-blue-500 ring-8 ring-blue-500/10 z-50':'border-transparent'}`}
style={{left:n.x,top:n.y,width:n.width,height:n.height}}>

<div className="h-2" style={{background:n.color}}/>

<div className="p-4 flex-1 flex flex-col overflow-hidden">
<div className="text-xs font-bold text-slate-400 mb-1">{n.title}</div>

<div className="flex-1 overflow-y-auto node-inner text-sm text-slate-700">
{getSpotify(n.media) && (
<iframe src={getSpotify(n.media)} width="100%" height="80" frameBorder="0"/>
)}
{n.content}
</div>
</div>

<div onMouseDown={e=>mouseDown(e,n,'resize')}
className="absolute bottom-0 right-0 w-6 h-6 cursor-nwse-resize"/>
</div>
))}

</div>

<div className="fixed bottom-8 left-1/2 -translate-x-1/2 bg-white p-4 rounded-full shadow-xl flex gap-4">
<button onClick={()=>addNode()}
className="bg-blue-600 text-white w-12 h-12 rounded-full flex items-center justify-center">
<Plus/>
</button>
</div>

{curr && (
<div className="fixed top-6 right-6 w-80 bg-white p-6 rounded-3xl shadow-xl"
onMouseDown={e=>e.stopPropagation()}>

<input value={curr.title}
onChange={e=>setNodes(nodes.map(n=>n.id===curr.id?{...n,title:e.target.value}:n))}
className="w-full p-3 mb-2 bg-slate-100 rounded-xl"/>

<textarea value={curr.content}
onChange={e=>setNodes(nodes.map(n=>n.id===curr.id?{...n,content:e.target.value}:n))}
className="w-full p-3 mb-2 bg-slate-100 rounded-xl h-24"/>

<div className="flex items-center gap-2 bg-slate-100 p-3 rounded-xl mb-3">
<Music/>
<input value={curr.media}
onChange={e=>setNodes(nodes.map(n=>n.id===curr.id?{...n,media:e.target.value}:n))}
className="bg-transparent w-full outline-none"/>
</div>

<button onClick={()=>addNode(curr)}
className="w-full bg-black text-white py-3 rounded-xl mb-2">Связать</button>

<button onClick={()=>setNodes(nodes.filter(n=>n.id!==curr.id))}
className="w-full text-red-500">Удалить</button>

</div>
)}

</div>
);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
</body>
</html>
