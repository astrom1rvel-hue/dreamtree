<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINDTREE</title>
    <!-- Подключаем Tailwind CSS для стилей -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Подключаем React и Babel, чтобы код из Canvas работал в браузере -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Подключаем иконки Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Достаем нужные функции из React
        const { useState, useCallback, useRef, useEffect } = React;

        // Эмуляция иконок для работы без импортов
        const Icon = ({ name, size = 24, ...props }) => {
            const [svg, setSvg] = useState('');
            useEffect(() => {
                if (window.lucide) {
                    const icon = window.lucide.icons[name];
                    if (icon) setSvg(icon.toSvg({ size, ...props }));
                }
            }, [name, size]);
            return <div dangerouslySetInnerHTML={{ __html: svg }} {...props} />;
        };

        // Заглушки для иконок, чтобы не менять твой основной код
        const Plus = (p) => <Icon name="Plus" {...p} />;
        const X = (p) => <Icon name="X" {...p} />;
        const ImageIcon = (p) => <Icon name="Image" {...p} />;
        const Hand = (p) => <Icon name="Hand" {...p} />;
        const Send = (p) => <Icon name="Send" {...p} />;
        const MessageCircle = (p) => <Icon name="MessageCircle" {...p} />;
        const Palette = (p) => <Icon name="Palette" {...p} />;
        const Sparkles = (p) => <Icon name="Sparkles" {...p} />;
        const Check = (p) => <Icon name="Check" {...p} />;
        const MousePointer2 = (p) => <Icon name="MousePointer2" {...p} />;
        const Music = (p) => <Icon name="Music" {...p} />;

        const DEFAULT_COLORS = [
            '#3b82f6', '#10b981', '#ef4444', '#8b5cf6', '#f59e0b', '#f472b6', '#64748b',
            '#06b6d4', '#84cc16', '#ec4899', '#f97316', '#7c3aed', '#db2777', '#2563eb', '#059669'
        ];

        function App() {
            // ТУТ ВЕСЬ ТВОЙ КОД (Я его уже вставил ниже)
            const [nodes, setNodes] = useState([
                { id: 'root-1', title: 'Мой Проект', content: 'Добро пожаловать!', x: 400, y: 200, width: 300, height: 150, parentId: null, type: 'text', color: '#3b82f6' }
            ]);
            const [selectedNodeId, setSelectedNodeId] = useState(null);
            const [offset, setOffset] = useState({ x: 0, y: 0 });
            const [scale, setScale] = useState(1);
            const [isPanning, setIsPanning] = useState(false);
            const [isDragMode, setIsDragMode] = useState(false);
            const [isChatOpen, setIsChatOpen] = useState(false);
            const [chatInput, setChatInput] = useState('');
            const [chatMessages, setChatMessages] = useState([{ role: 'ai', text: 'Привет! Я добавил поддержку Spotify. Просто вставь ссылку в поле Медиа!' }]);

            const interactionRef = useRef({ activeId: null, type: null, startX: 0, startY: 0, initialNodeX: 0, initialNodeY: 0, initialWidth: 0, initialHeight: 0 });

            useEffect(() => {
                const handleMouseMove = (e) => {
                    const { activeId, type, initialNodeX, initialNodeY, initialWidth, initialHeight, startX, startY } = interactionRef.current;
                    if (isPanning) {
                        setOffset(prev => ({ x: prev.x + e.movementX, y: prev.y + e.movementY }));
                        return;
                    }
                    if (!activeId) return;
                    e.preventDefault();
                    const dx = (e.clientX - startX) / scale;
                    const dy = (e.clientY - startY) / scale;
                    const el = document.querySelector(`[data-node-id="${activeId}"]`);
                    if (!el) return;
                    if (type === 'drag') {
                        el.style.left = `${initialNodeX + dx}px`;
                        el.style.top = `${initialNodeY + dy}px`;
                    } else if (type === 'resize') {
                        el.style.width = `${Math.max(200, initialWidth + dx)}px`;
                        el.style.height = `${Math.max(150, initialHeight + dy)}px`;
                    }
                };
                const handleMouseUp = () => {
                    if (interactionRef.current.activeId) {
                        const { activeId } = interactionRef.current;
                        const el = document.querySelector(`[data-node-id="${activeId}"]`);
                        if (el) {
                            setNodes(prev => prev.map(n => n.id === activeId ? { ...n, x: parseFloat(el.style.left), y: parseFloat(el.style.top), width: parseFloat(el.style.width), height: parseFloat(el.style.height) } : n));
                        }
                    }
                    setIsPanning(false);
                    interactionRef.current.activeId = null;
                };
                window.addEventListener('mousemove', handleMouseMove);
                window.addEventListener('mouseup', handleMouseUp);
                return () => {
                    window.removeEventListener('mousemove', handleMouseMove);
                    window.removeEventListener('mouseup', handleMouseUp);
                };
            }, [isPanning, scale]);

            const handleWheel = useCallback((e) => {
                if (e.target.closest('.editor-panel') || e.target.closest('.chat-panel') || e.target.closest('.node-inner')) return;
                e.preventDefault();
                const zoomIntensity = 0.08;
                const delta = e.deltaY > 0 ? -zoomIntensity : zoomIntensity;
                const newScale = Math.max(0.15, Math.min(2.5, scale + scale * delta));
                const zoomFactor = newScale / scale;
                setOffset(prev => ({ x: e.clientX - (e.clientX - prev.x) * zoomFactor, y: e.clientY - (e.clientY - prev.y) * zoomFactor }));
                setScale(newScale);
            }, [scale]);

            const onNodeMouseDown = (e, node, type) => {
                if (isDragMode || type === 'resize') e.preventDefault();
                e.stopPropagation();
                if (!isDragMode && type === 'drag') { setSelectedNodeId(node.id); return; }
                interactionRef.current = { activeId: node.id, type, startX: e.clientX, startY: e.clientY, initialNodeX: node.x, initialNodeY: node.y, initialWidth: node.width, initialHeight: node.height };
            };

            const handleAddRoot = () => {
                const newNode = { id: `node-${Date.now()}`, title: 'Новая идея', content: '', x: (window.innerWidth / 2 - offset.x) / scale - 150, y: (window.innerHeight / 2 - offset.y) / scale - 75, width: 300, height: 180, type: 'text', parentId: null, color: DEFAULT_COLORS[Math.floor(Math.random() * DEFAULT_COLORS.length)] };
                setNodes([...nodes, newNode]);
                setSelectedNodeId(newNode.id);
            };

            const handleLinkNode = (parent) => {
                const angle = Math.random() * Math.PI * 2;
                const newNode = { id: `node-${Date.now()}`, title: 'Связанная мысль', content: '', x: parent.x + Math.cos(angle) * 400, y: parent.y + Math.sin(angle) * 400, width: 300, height: 180, type: 'text', parentId: parent.id, color: parent.color };
                setNodes(prev => [...prev, newNode]);
                setSelectedNodeId(newNode.id);
            };

            const getSpotifyEmbedUrl = (url) => {
                if (!url) return null;
                const match = url.match(/spotify\.com\/(track|album|playlist|artist)\/([a-zA-Z0-9]+)/);
                return match ? `https://open.spotify.com/embed/${match[1]}/${match[2]}` : null;
            };

            const currentNode = nodes.find(n => n.id === selectedNodeId);

            return (
                <div className={`fixed inset-0 bg-[#f8fafc] overflow-hidden flex font-sans text-slate-900 ${isPanning ? 'cursor-grabbing select-none' : ''}`} onWheel={handleWheel} onMouseDown={(e) => { if(e.target.id === 'canvas-bg') setIsPanning(true); }}>
                    <div id="canvas-bg" className="absolute inset-0" style={{ backgroundImage: 'radial-gradient(#e2e8f0 1.5px, transparent 1.5px)', backgroundSize: `${40 * scale}px ${40 * scale}px`, backgroundPosition: `${offset.x}px ${offset.y}px` }}>
                        <div style={{ transform: `translate(${offset.x}px, ${offset.y}px) scale(${scale})`, transformOrigin: '0 0' }} className="absolute inset-0 pointer-events-none">
                            <svg className="absolute inset-0 w-[10000px] h-[10000px]">
                                {nodes.map(node => {
                                    if (!node.parentId) return null;
                                    const parent = nodes.find(p => p.id === node.parentId);
                                    if (!parent) return null;
                                    return <path key={node.id} d={`M ${parent.x + parent.width/2} ${parent.y + parent.height/2} Q ${(parent.x+node.x+parent.width)/2} ${(parent.y+node.y+parent.height)/2 - 50} ${node.x + node.width/2} ${node.y + node.height/2}`} stroke={node.color} strokeWidth="3" fill="none" opacity="0.3" strokeDasharray="6,6" />;
                                })}
                            </svg>
                            {nodes.map(node => (
                                <div key={node.id} data-node-id={node.id} onMouseDown={(e) => onNodeMouseDown(e, node, 'drag')} className={`absolute pointer-events-auto flex flex-col bg-white rounded-[32px] shadow-2xl border-2 ${selectedNodeId === node.id ? 'ring-[14px] ring-blue-500/5 border-blue-500 z-50' : 'border-transparent z-10'}`} style={{ left: node.x, top: node.y, width: node.width, height: node.height, borderTop: `12px solid ${node.color}` }}>
                                    <div className="node-inner p-6 flex-1 overflow-y-auto">
                                        <div className="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-4 flex items-center gap-2">
                                            <div className="w-3 h-3 rounded-full" style={{backgroundColor: node.color}} /> {node.title}
                                        </div>
                                        {node.type === 'media' ? (
                                            <div className="flex-1 h-full">
                                                {getSpotifyEmbedUrl(node.imageUrl) ? <iframe src={getSpotifyEmbedUrl(node.imageUrl)} width="100%" height="100%" frameBorder="0" allow="encrypted-media" className="rounded-2xl" /> : <div className="w-full h-full bg-slate-50 rounded-xl flex items-center justify-center text-slate-300">Пустой медиа-блок</div>}
                                            </div>
                                        ) : <div className="text-slate-700 font-medium">{node.content || "..."}</div>}
                                    </div>
                                    <div onMouseDown={(e) => onNodeMouseDown(e, node, 'resize')} className="absolute bottom-0 right-0 w-8 h-8 cursor-nwse-resize" />
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="fixed top-8 left-8 bg-white p-4 rounded-[30px] shadow-2xl flex gap-4 pointer-events-auto items-center">
                        <Sparkles className="text-blue-500" />
                        <button onClick={handleAddRoot} className="bg-blue-600 text-white px-6 py-3 rounded-2xl font-bold uppercase text-[10px]">Новый узел</button>
                    </div>

                    {selectedNodeId && currentNode && (
                        <div className="editor-panel fixed top-8 right-8 w-80 bg-white p-8 rounded-[40px] shadow-2xl z-[200]">
                            <button onClick={() => setSelectedNodeId(null)} className="absolute top-4 right-4"><X /></button>
                            <h2 className="font-black uppercase mb-4">Настройки</h2>
                            <input className="w-full bg-slate-50 p-4 rounded-xl mb-4" value={currentNode.title} onChange={e => setNodes(nodes.map(n => n.id === selectedNodeId ? {...n, title: e.target.value} : n))} />
                            <textarea className="w-full bg-slate-50 p-4 rounded-xl h-32" value={currentNode.content} onChange={e => setNodes(nodes.map(n => n.id === selectedNodeId ? {...n, content: e.target.value} : n))} />
                            <button onClick={() => handleLinkNode(currentNode)} className="w-full bg-slate-900 text-white py-4 rounded-2xl mt-4 uppercase font-bold text-[10px]">Связать идею</button>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
