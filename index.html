<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINDTREE PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body, html, #root { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #f8fafc; }
        .node-inner::-webkit-scrollbar { width: 4px; }
        .node-inner::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useCallback, useRef, useEffect } = React;

        // Встроенные SVG-иконки, чтобы ничего не ломалось
        const PlusIcon = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
        const MusicIcon = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>;

        const DEFAULT_COLORS = ['#3b82f6', '#10b981', '#ef4444', '#8b5cf6', '#f59e0b', '#f472b6', '#06b6d4'];

        function App() {
            const [nodes, setNodes] = useState([
                { id: '1', title: 'PROJECT', content: 'Вставь ссылку Spotify в поле медиа!', x: 400, y: 200, width: 320, height: 200, parentId: null, type: 'text', color: '#3b82f6', mediaUrl: '' }
            ]);
            const [selectedNodeId, setSelectedNodeId] = useState(null);
            const [offset, setOffset] = useState({ x: 0, y: 0 });
            const [scale, setScale] = useState(1);
            const [isPanning, setIsPanning] = useState(false);

            const interact = useRef({ id: null, type: null, startX: 0, startY: 0, iX: 0, iY: 0, iW: 0, iH: 0 });

            const getSpotifyEmbed = (url) => {
                if (!url) return null;
                const m = url.match(/spotify\.com\/(track|album|playlist|artist)\/([a-zA-Z0-9]+)/);
                return m ? `https://open.spotify.com/embed/${m[1]}/${m[2]}` : null;
            };

            const onMouseDown = (e, node, type) => {
                if (type === 'canvas') { setIsPanning(true); return; }
                e.stopPropagation();
                setSelectedNodeId(node.id);
                interact.current = { id: node.id, type, startX: e.clientX, startY: e.clientY, iX: node.x, iY: node.y, iW: node.width, iH: node.height };
            };

            useEffect(() => {
                const move = (e) => {
                    if (isPanning) {
                        setOffset(prev => ({ x: prev.x + e.movementX, y: prev.y + e.movementY }));
                        return;
                    }
                    const { id, type, startX, startY, iX, iY, iW, iH } = interact.current;
                    if (!id) return;
                    const dx = (e.clientX - startX) / scale;
                    const dy = (e.clientY - startY) / scale;

                    setNodes(prev => prev.map(n => {
                        if (n.id !== id) return n;
                        return type === 'drag' 
                            ? { ...n, x: iX + dx, y: iY + dy }
                            : { ...n, width: Math.max(200, iW + dx), height: Math.max(150, iH + dy) };
                    }));
                };
                const up = () => { setIsPanning(false); interact.current.id = null; };
                window.addEventListener('mousemove', move);
                window.addEventListener('mouseup', up);
                return () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
            }, [isPanning, scale]);

            const addNode = (parent = null) => {
                const id = Date.now().toString();
                const newNode = {
                    id,
                    title: 'ИДЕЯ',
                    content: '',
                    x: parent ? parent.x + 400 : (window.innerWidth/2 - offset.x)/scale - 150,
                    y: parent ? parent.y + 50 : (window.innerHeight/2 - offset.y)/scale - 75,
                    width: 300, height: 200,
                    parentId: parent ? parent.id : null,
                    color: parent ? parent.color : DEFAULT_COLORS[Math.floor(Math.random()*7)],
                    mediaUrl: ''
                };
                setNodes([...nodes, newNode]);
                setSelectedNodeId(id);
            };

            const curr = nodes.find(n => n.id === selectedNodeId);

            return (
                <div className="w-full h-full relative overflow-hidden select-none" onMouseDown={(e) => onMouseDown(e, null, 'canvas')}>
                    <div className="absolute inset-0" style={{ 
                        backgroundImage: 'radial-gradient(#e2e8f0 2px, transparent 2px)', 
                        backgroundSize: `${30 * scale}px ${30 * scale}px`,
                        backgroundPosition: `${offset.x}px ${offset.y}px`
                    }} />

                    <div style={{ transform: `translate(${offset.x}px, ${offset.y}px) scale(${scale})`, transformOrigin: '0 0' }}>
                        <svg className="absolute inset-0 pointer-events-none" style={{width: 5000, height: 5000}}>
                            {nodes.map(n => {
                                const p = nodes.find(x => x.id === n.parentId);
                                if (!p) return null;
                                return <path key={n.id} d={`M ${p.x + p.width} ${p.y + p.height/2} C ${p.x + p.width + 100} ${p.y + p.height/2}, ${n.x - 100} ${n.y + n.height/2}, ${n.x} ${n.y + n.height/2}`} stroke={n.color} strokeWidth="4" fill="none" opacity="0.4" />;
                            })}
                        </svg>

                        {nodes.map(n => (
                            <div key={n.id} onMouseDown={(e) => onMouseDown(e, n, 'drag')} className={`absolute bg-white rounded-[32px] shadow-2xl border-2 flex flex-col overflow-hidden ${selectedNodeId === n.id ? 'border-blue-500 ring-8 ring-blue-500/10 z-50' : 'border-transparent z-10'}`} style={{ left: n.x, top: n.y, width: n.width, height: n.height }}>
                                <div className="h-2 w-full" style={{ background: n.color }} />
                                <div className="p-5 flex-1 overflow-hidden flex flex-col">
                                    <div className="text-[10px] font-black text-slate-400 uppercase tracking-tighter mb-2">{n.title}</div>
                                    <div className="flex-1 overflow-y-auto node-inner text-slate-700 font-medium text-sm">
                                        {getSpotifyEmbed(n.mediaUrl) ? (
                                            <iframe src={getSpotifyEmbed(n.mediaUrl)} width="100%" height="80" frameBorder="0" allow="encrypted-media" className="rounded-xl mb-2" />
                                        ) : null}
                                        {n.content}
                                    </div>
                                </div>
                                <div onMouseDown={(e) => onMouseDown(e, n, 'resize')} className="absolute bottom-0 right-0 w-6 h-6 cursor-nwse-resize hover:bg-slate-100 rounded-tl-lg" />
                            </div>
                        ))}
                    </div>

                    <div className="fixed bottom-10 left-1/2 -translate-x-1/2 bg-white/80 backdrop-blur-md px-6 py-4 rounded-full shadow-2xl border border-white flex gap-6 items-center">
                        <button onClick={() => addNode()} className="bg-blue-600 text-white w-12 h-12 rounded-full flex items-center justify-center hover:scale-110 transition-transform shadow-lg"><PlusIcon /></button>
                        <div className="h-6 w-[1px] bg-slate-200" />
                        <div className="text-xs font-bold text-slate-500 tracking-widest uppercase">MindTree v2.0</div>
                    </div>

                    {curr && (
                        <div className="fixed top-6 right-6 w-80 bg-white p-8 rounded-[40px] shadow-2xl border border-slate-100" onMouseDown={e => e.stopPropagation()}>
                            <div className="flex justify-between items-center mb-6">
                                <div className="font-black uppercase text-xs tracking-widest text-slate-400">Настройки</div>
                                <button onClick={() => setSelectedNodeId(null)} className="text-slate-300 hover:text-slate-900">✕</button>
                            </div>
                            <input placeholder="Заголовок" className="w-full bg-slate-50 p-4 rounded-2xl mb-3 outline-none focus:ring-2 ring-blue-500" value={curr.title} onChange={e => setNodes(nodes.map(n => n.id === selectedNodeId ? {...n, title: e.target.value} : n))} />
                            <textarea placeholder="Текст мысли..." className="w-full bg-slate-50 p-4 rounded-2xl h-32 mb-3 outline-none focus:ring-2 ring-blue-500 resize-none" value={curr.content} onChange={e => setNodes(nodes.map(n => n.id === selectedNodeId ? {...n, content: e.target.value} : n))} />
                            <div className="flex items-center gap-2 bg-slate-50 p-4 rounded-2xl mb-4 text-slate-400">
                                <MusicIcon />
                                <input placeholder="Ссылка Spotify" className="bg-transparent w-full outline-none text-sm text-slate-700" value={curr.mediaUrl} onChange={e => setNodes(nodes.map(n => n.id === selectedNodeId ? {...n, mediaUrl: e.target.value} : n))} />
                            </div>
                            <button onClick={() => addNode(curr)} className="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold text-[10px] uppercase tracking-widest hover:bg-black transition-colors">Связать идею</button>
                            <button onClick={() => setNodes(nodes.filter(n => n.id !== selectedNodeId))} className="w-full mt-2 text-[10px] font-bold text-red-400 uppercase tracking-widest">Удалить узел</button>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
